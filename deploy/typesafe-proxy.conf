# Include inside the HTTPS server hosting the built Veles app.
# Vite dev AND preview already supply this route. Static hosting needs it too.
location = /api/proxy/typesafe {
    limit_except POST { deny all; }
    client_max_body_size 512k;
    proxy_pass https://api.typesafe.ai/v1/systemone;
    proxy_set_header Host api.typesafe.ai;
    proxy_ssl_server_name on;
    proxy_ssl_verify on;
    proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
    proxy_read_timeout 15s;
}
